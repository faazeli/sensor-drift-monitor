[project]
name = "sensor-drift-monitor"
version = "0.1.0"
description = "Sensor fault detection and drift monitoring on 36 months of real gas-sensor-array data: statistical process monitoring, isolation forest and a PyTorch autoencoder, benchmarked."
readme = "README.md"
authors = [
    { name = "faazeli", email = "53350290+faazeli@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "tabulate>=0.10.0",
    "torch>=2.14.1",
    "typer>=0.27.3",
]

[project.scripts]
sensor-drift-monitor = "sensor_drift_monitor:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
